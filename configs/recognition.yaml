# Baseline recognition model — see docs/ROADMAP.md Phase 3. TrOCR-small was
# chosen over training a CRNN+CTC baseline from scratch: this project's
# modeling strategy (see ROADMAP "Decisions on record") is to fine-tune a
# pretrained backbone rather than train one from scratch on modest local
# hardware, and TrOCR-small-handwritten is already pretrained specifically
# for handwriting recognition, unlike an untrained CRNN.
# model_name accepts either a HuggingFace hub id OR a path to a local
# fine-tuned checkpoint (produced by training/train.py). The default below
# points at the Phase 4 hard-negative-mined CVL fine-tune, which beat the
# pretrained baseline on all five metrics on a 500-sample CVL test slice
# (CER 0.482→0.314, WER 0.740→0.354, exact-match 0.376→0.646) — see the
# ROADMAP Phase 4 section. On a fresh clone the weights/ dir is gitignored,
# so to reproduce you either re-run `uv run python -m training.train` with
# CVL prepared, or switch model_name back to "microsoft/trocr-small-handwritten".
model_name: "weights/trocr-cvl-hn/step-6934"
device: "auto" # auto | cpu | cuda
max_new_tokens: 32

# Generation-time repetition guards. The Phase 4 HN-mined fine-tune still
# occasionally produces trailing-character repetition ("Triangles" ->
# "Trianglesssss") on hard inputs — a milder residue of the plain fine-tune's
# 32-token runaway degeneracy. no_repeat_ngram_size hard-forbids any n-gram
# from occurring twice; N=3 (not 2) preserves legitimate words with a repeated
# bigram (e.g. "onion" = o,n,i,o,n contains the bigram (o,n) twice; "banana"
# contains (a,n) twice) while still stopping the runaway after at most three
# repetitions. On a 500-sample CVL test slice, ngram=3 alone reduced CER
# 0.314 → 0.286 with no exact-match regression — a strict Pareto win over no
# guards. See docs/ROADMAP.md Phase 4.
#
# repetition_penalty softly downweights already-generated tokens (paper
# 1909.05858) but was empirically net-negative here: at 1.2 it flipped some
# previously-correct outputs (e.g. "Imagine" → "Imagines") and regressed
# exact-match from 0.646 → 0.608. Left at 1.0 (disabled) as the committed
# default; kept as a config field so it can be tuned per-model if a future
# checkpoint has different degeneracy characteristics. Set no_repeat_ngram_size
# to 0 to also disable that guard and match transformers defaults.
repetition_penalty: 1.0
no_repeat_ngram_size: 3

# Personalization adapter (Phase 5, PR 5). Layers a per-user LoRA on top of
# the base model_name above, without modifying base weights. Accepts:
#   null      -> no adapter, run plain base model (default; the fresh-install
#                behavior).
#   "latest"  -> auto-resolve to the newest accepted adapter dir under
#                configs/feedback.yaml's adapter_dir. Silently falls back to
#                null if none exist yet, so a clone with no corrections still
#                recognizes. Recommended once the feedback loop is running.
#   <path>    -> literal path to an adapter dir (relative to repo root or
#                absolute) — pin a specific version for A/B or rollback.
# See docs/ROADMAP.md Phase 5 and models/adapters/resolver.py.
adapter_path: null
