# Augmentation pipeline parameters (preprocessing/augmentation.py). Applied on
# the fly at training time — datasets/processed/ images stay clean.

seed: null # null = non-deterministic; set an int for reproducible runs (e.g. tests)
fill_value: 255 # background color (white paper) used where geometric transforms expose empty space

rotate:
  limit: 5 # degrees
  p: 0.5
shear:
  limit: 10 # degrees — simulates handwriting slant
  p: 0.5
scale:
  limit: 0.1 # +/- 10%
  p: 0.3
perspective:
  scale: [0.02, 0.05]
  p: 0.3
elastic:
  alpha: 1.0
  sigma: 20.0
  p: 0.2
blur:
  limit: 3 # max kernel size
  p: 0.3
noise:
  std_range: [0.02, 0.08] # fraction of the pixel value range
  p: 0.3
brightness_contrast:
  brightness_limit: 0.2
  contrast_limit: 0.2
  p: 0.4
compression:
  quality_range: [40, 90]
  p: 0.2
crop_pad:
  percent: 0.05
  p: 0.3
pen_thickness:
  scale: [1, 3] # kernel size range for erosion/dilation
  p: 0.4
ink_fading:
  min_alpha: 0.4 # lower alpha = more faded (closer to background)
  max_alpha: 0.9
  p: 0.3
paper_texture:
  intensity: 0.15 # 0 = no texture, 1 = fully replaced by noise texture
  p: 0.3
