# Document upload pipeline (Phase 6). Governs how uploaded images (and
# later PDFs) are validated before entering the recognition pipeline.
#
# allowed_image_extensions: lowercase, leading dot. Anything not in this
# list is rejected before Pillow gets a chance to open it, so an unknown
# format can't trip a slow decoder or (worse) hit a decoder CVE. Add new
# formats deliberately — every entry here must be one Pillow can decode
# to grayscale.
#
# max_image_bytes: hard ceiling checked via os.stat before decode, so a
# hostile multi-GB "image" can't exhaust memory during PIL.Image.open. 50 MB
# is generous for scanned handwriting pages (a color 300-DPI Letter scan is
# ~25 MB uncompressed, far less as PNG/JPEG) — bump it here rather than in
# code if the app ever gains a legitimate need for huge inputs.
allowed_image_extensions:
  - .png
  - .jpg
  - .jpeg
  - .tif
  - .tiff
max_image_bytes: 52428800  # 50 MiB

# PDF ingest (Phase 6, PR 2). max_pdf_bytes is looser than max_image_bytes
# because a legitimately multi-page scan is bigger than a single-page one;
# max_pdf_pages is the second guard so a hostile 100k-page PDF can't force
# the loader into a huge render loop even if it slips under the byte cap.
max_pdf_bytes: 209715200  # 200 MiB
max_pdf_pages: 200

# Rendering resolution per page. 150 DPI matches the working-image size
# TrOCR-small ingests (~384px) after segmentation without forcing an
# up-then-downsample round trip, and keeps per-page RAM ~2 MB grayscale
# for a Letter page. Raise for small handwriting, lower for large-print
# documents where segmentation is easier and speed matters more.
pdf_render_dpi: 150

# Page layout / text-region detection (Phase 6, PR 3). Applied to any
# ingested page (image or PDF) before batch inference. See
# documents.layout.analyze_page.
layout:
  # Whether to deskew the page before segmentation. Cheap when the page
  # is already close to horizontal (below ~1e-3 degrees the function
  # returns the image untouched), so leave on by default. Turn off only
  # if a caller wants coordinates in the exact original coordinate
  # system.
  deskew: true
  # Adaptive-threshold window + bias. Larger block_size handles
  # uneven lighting on scanned pages but blurs finer strokes; c tunes
  # the local mean offset. Defaults match preprocessing/image_ops.py.
  binarize_block_size: 35
  binarize_c: 11
  # Line segmentation thresholds. min_line_height drops noise bands
  # shorter than this; min_line_gap merges vertically-close bands that
  # come from the same line with an ascender/descender gap.
  min_line_height: 5
  min_line_gap: 3
  # Word segmentation thresholds within a line. Gap larger than
  # min_word_gap → new word; band narrower than min_word_width → drop
  # as noise. These need re-tuning for very-small or very-large text
  # (both scale with x-height, not absolute pixels).
  min_word_gap: 8
  min_word_width: 3
